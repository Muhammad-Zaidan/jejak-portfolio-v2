<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232120"/>
      <stop offset="1" stop-color="#0c0b0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.35">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="229" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="6"/>
  <!-- the JEJAK ring, open at the top right, where the "on" light sits -->
  <circle cx="512" cy="512" r="248" fill="none" stroke="#f4f1ec" stroke-width="88" stroke-linecap="round"
          stroke-dasharray="1258 300" transform="rotate(-20 512 512)"/>
  <circle cx="655" cy="310" r="60" fill="#ff5a1f"/>
</svg>
